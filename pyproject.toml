[project]
name = "runthrough"
version = "0.1.0"
description = "Record real terminal sessions from declarative tapes, and author those tapes from a question."
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.1.0",
    "fonttools>=4.53.0",
    "pyte>=0.8.2",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
runthrough = "runthrough.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runthrough"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
