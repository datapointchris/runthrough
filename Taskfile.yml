version: "3"

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Make a fresh checkout runnable and install the git hooks
    cmds:
      - uv sync
      - uv run pre-commit install --hook-type pre-commit --hook-type commit-msg

  test:
    desc: Run all tests
    cmds:
      - uv run pytest

  lint:
    desc: Run ruff and mypy without writing any file
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - task: typecheck

  typecheck:
    desc: Type check with mypy
    cmds:
      - uv run mypy src

  format:
    desc: Apply ruff formatting and autofixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  build:
    desc: Build the wheel and sdist into dist/
    cmds:
      - uv build

  install:
    desc: Install this checkout as the runthrough uv tool, over any release
    cmds:
      - uv tool install --force .
